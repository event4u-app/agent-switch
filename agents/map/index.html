<!doctype html>
<html lang="en" data-resolved-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-MycCb3vEYRiyQvwMC6zgWxYCTknl5pbAR+MDqdwff44='; style-src 'sha256-Gfk03EUzoGwRgzhgpsNqVcHjUv1xfFZxCEX9P/F2mDA='; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Map of agent-switch</title>
<style>/* Workbench viewer for agents/map/index.html. Tokens are the supplied design's,
   dark and light; no font is fetched, so each family falls back to the system. */
:root,
:root[data-resolved-theme='dark'] {
    --bg: #070b12; --panel: #0d131d; --rail: #0a1018; --raise: #131c2a; --line: #1c2738; --line2: #2a3445;
    --text: #e8eef7; --muted: #93a1b5; --soft: #c3cedd; --faint: #6f7d92;
    --brand: #ff8c2a; --brandText: #ff9d47; --brandTint: rgba(255, 140, 42, 0.16); --brandLine: rgba(255, 140, 42, 0.55);
    --cyan: #3ec5ff; --cyanText: #8adcff; --cyanTint: rgba(62, 197, 255, 0.13);
    --green: #3ddc84; --greenText: #3ddc84; --greenTint: rgba(61, 220, 132, 0.14);
    --amber: #ffc14d; --amberText: #ffc14d; --sand: #f5e08a; --d3: #a7c46b;
    --node: #2a3445; --nodeStroke: #3a4760; --edge: rgba(200, 214, 235, 0.17); --grid: rgba(62, 197, 255, 0.055);
    --doc: #6b7280; --violet: #c9a2ff; --onColor: #0d1522; --blastBg: #120d08; --glow: 0.9;
    --alert: #ff5d6c; --alertText: #e0414f;
    --orb-light: rgba(62, 197, 255, 0.10); --orb-dark: rgba(7, 11, 18, 0);
    color-scheme: dark;
}
:root[data-resolved-theme='light'] {
    --bg: #f3f5f9; --panel: #ffffff; --rail: #fafbfd; --raise: #eef2f7; --line: #dde3ec; --line2: #c3ccd9;
    --text: #0d1522; --muted: #536074; --soft: #334155; --faint: #8592a5;
    --brand: #f47a12; --brandText: #b4530a; --brandTint: rgba(244, 122, 18, 0.12); --brandLine: rgba(244, 122, 18, 0.6);
    --cyan: #0ea5e9; --cyanText: #0369a1; --cyanTint: rgba(14, 165, 233, 0.12);
    --green: #16a34a; --greenText: #15803d; --greenTint: rgba(22, 163, 74, 0.12);
    --amber: #f5b324; --amberText: #92580a; --sand: #ecd06a; --d3: #86b25a;
    --node: #cdd5e1; --nodeStroke: #aab5c6; --edge: rgba(30, 41, 59, 0.17); --grid: rgba(14, 165, 233, 0.09);
    --doc: #9aa3b2; --violet: #8b5cf6; --onColor: #0d1522; --blastBg: #fff8ef; --glow: 0.35;
    --orb-light: rgba(14, 165, 233, 0.12); --orb-dark: rgba(243, 245, 249, 0);
    color-scheme: light;
}
:root { --sbThumb: color-mix(in srgb, var(--muted) 45%, transparent); --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --monof: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --display: 'Anton', Impact, 'Arial Narrow', sans-serif; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; overflow-x: hidden; }
a { color: var(--cyanText); }
button { font: inherit; cursor: pointer; color: inherit; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.mono { font-family: var(--monof); overflow-wrap: anywhere; }
.cap { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.16em; }
.muted { color: var(--muted); }
.soft { color: var(--soft); }
[hidden] { display: none !important; }
* { scrollbar-width: thin; scrollbar-color: var(--sbThumb) transparent; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { display: block; flex: none; border-radius: 9px; }
.brand-name { display: flex; flex-direction: column; gap: 1px; }
.brand-name b { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1; letter-spacing: 0.02em; }
.brand-name span { font-size: 10px; font-weight: 600; letter-spacing: 0.32em; color: var(--brandText); }
.pins { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; }
.chip { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--soft); }
.chip.fresh { border: 0; background: var(--greenTint); color: var(--greenText); display: inline-flex; align-items: center; gap: 6px; }
.chip.stale { border: 0; background: var(--brandTint); color: var(--brandText); display: inline-flex; align-items: center; gap: 6px; }
.chip.fresh::before, .chip.stale::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.gen { color: var(--muted); }
.search { position: relative; flex: 1 1 260px; display: flex; align-items: center; gap: 8px; min-width: 220px; max-width: 520px; margin-left: auto; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.search svg { color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; height: 36px; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 13px; outline: none; }
.kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.results { position: absolute; z-index: 20; top: 40px; left: 0; right: 0; margin: 0; padding: 4px; list-style: none; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.results:empty { display: none; }
.results button { width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; font-family: var(--monof); font-size: 12px; overflow-wrap: anywhere; }
.results button:hover { background: var(--raise); }
.actions { display: flex; gap: 6px; }
.btn { height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); color: var(--text); font-size: 13px; }
.btn.icon { width: 44px; padding: 0; display: flex; align-items: center; justify-content: center; }

/* Frame */
.wb { flex: 1; display: flex; flex-wrap: nowrap; align-items: stretch; min-height: 0; }
.rail { flex: 1 1 280px; max-width: 320px; min-width: 260px; border-right: 1px solid var(--line); background: var(--rail); display: flex; flex-direction: column; }
.rail section, .side section.sec { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.rail section:last-child { border-bottom: 0; flex: 1; }
.side { flex: 1 1 380px; max-width: 440px; min-width: 300px; border-left: 1px solid var(--line); border-right: 0; }
.center { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

/* Left rail */
.health-head { display: flex; align-items: center; gap: 14px; }
.ring { width: 62px; height: 62px; border-radius: 50%; border: 3px solid var(--brand); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
.ring.none { border: 3px dashed var(--line2); color: var(--muted); }
.health-title { display: flex; flex-direction: column; gap: 2px; }
.health-title b { font-weight: 600; font-size: 15px; }
.health-title span { font-size: 12px; color: var(--muted); }
.linkish { padding: 0; border: 0; background: none; color: var(--cyanText); font-size: 12px; text-align: left; text-decoration: underline; }
.formula { font-size: 11px; color: var(--muted); }
.parts { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
.part { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.part .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); }
.part .bar i { display: block; height: 4px; border-radius: 2px; }
.part.missing { color: var(--muted); }
.dashchip { font-size: 11px; border: 1px dashed var(--line2); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; }
.tile .v { font-family: var(--monof); font-size: 20px; font-weight: 600; }
.tile .v small { font-size: 13px; color: var(--muted); }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.stack i { display: block; height: 8px; }
.stack .hatch { background: repeating-linear-gradient(90deg, var(--amber) 0 3px, transparent 3px 5px); }
.stack .hatch4 { background: repeating-linear-gradient(90deg, var(--amber) 0 4px, transparent 4px 6px); }
.keys { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--soft); }
.keys .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.between { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--soft); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.opt { height: 34px; padding: 0 10px; text-align: left; border-radius: 7px; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt[aria-checked='true'] { border-color: var(--brandLine); background: var(--brandTint); color: var(--text); }
.opt:disabled { border-style: dashed; border-color: var(--line2); color: var(--faint); }
.explorer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.scope { font-size: 11px; height: 26px; padding: 0 8px; border-radius: 13px; border: 1px solid var(--cyan); background: var(--cyanTint); color: var(--cyanText); display: flex; align-items: center; gap: 4px; max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tree { display: flex; flex-direction: column; font-family: var(--monof); font-size: 12px; max-height: 420px; overflow: auto; }
.tree button { display: flex; justify-content: space-between; gap: 8px; padding: 5px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--soft); text-align: left; font-family: var(--monof); font-size: 12px; width: 100%; }
.tree button span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree button .n { color: var(--muted); flex: none; }
.tree button.on { background: var(--cyanTint); color: var(--text); }
.tree button.sel { color: var(--brandText); font-weight: 600; }

/* Center */
.bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.lenses { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.lens { height: 34px; padding: 0 14px; border-radius: 7px; border: 0; font-size: 13px; font-weight: 500; background: transparent; color: var(--soft); }
.lens[aria-selected='true'] { font-weight: 600; background: var(--brandTint); box-shadow: inset 0 0 0 1px var(--brandLine); color: var(--text); }
.lens:disabled { color: var(--faint); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--muted); }
.fbtn { height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--soft); font-size: 12px; }
.fbtn[aria-pressed='true'] { border-color: var(--cyan); background: var(--cyanTint); color: var(--text); }
.fbtn.dash[aria-pressed='false'] { border-style: dashed; border-color: var(--line2); }
.fullbtn { height: 30px; padding: 0 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border: 1px solid var(--line2); background: var(--raise); color: var(--text); }
.fullbtn[aria-pressed='true'] { border-color: var(--brand); background: var(--brand); color: var(--onColor); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 16px; font-size: 12px; color: var(--muted); font-family: var(--monof); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted); font-family: var(--monof); font-size: 12px; }
.crumbs button:last-child { color: var(--text); }
.crumbs .nav-back { padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--raise); }
.crumbs button:disabled { cursor: default; }
.view { flex: 1; position: relative; min-height: 0; overflow: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.stage { position: relative; height: 600px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background-color: var(--bg); background-image: radial-gradient(circle at 50% 50%, rgba(255, 140, 42, 0.08) 0%, rgba(62, 197, 255, 0.04) 35%, transparent 65%), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: auto, 32px 32px, 32px 32px; cursor: grab; touch-action: none; }
.wb.full .stage { height: calc(100vh - 190px); min-height: 520px; }
/* The map uses the whole height it is given, at every width: the page is one
   viewport tall, the stage takes what the centre column leaves. */
body { height: 100vh; height: 100dvh; }
.center { min-height: 0; }
.view { min-height: 0; }
#graphwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
#graphwrap[hidden] { display: none; }
.stage, .wb.full .stage { flex: 1; height: auto; min-height: 320px; }

/* Side panels. Pinned: a column beside the centre, which gets narrower.
   Not pinned: a flyout over the centre, opened by its button. Below 721 px
   nothing pins (the viewer never sets the class there). */
.rail { overflow-y: auto; }
.pane-head { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
.pane-head button, .pane-open { height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--soft); font-size: 12px; font-weight: 600; }
/* "Unpin" is an action, not a state: it stays neutral, never the brand fill of a pressed control. */
.pane-head .pane-pin[aria-pressed='true'] { background: transparent; border-color: var(--line); color: var(--soft); }
.pane-close { width: 30px; padding: 0; font-size: 16px; }
.wb.pin-left #open-left, .wb.pin-right #open-right { display: none; }
.wb.pin-left #close-left, .wb.pin-right #close-right { display: none; }
.wb.mode-phone .pane-pin { display: none; }
.wb:not(.pin-left) #pane-left, .wb:not(.pin-right) #pane-right {
    position: fixed; top: 0; bottom: 0; z-index: 40; min-width: 0; max-width: none;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); visibility: hidden;
    transition: transform 0.2s ease, visibility 0.2s;
}
.wb:not(.pin-left) #pane-left { left: 0; width: min(320px, 88vw); transform: translateX(-105%); }
.wb:not(.pin-right) #pane-right { right: 0; width: min(440px, 92vw); transform: translateX(105%); border-left: 1px solid var(--line); }
.wb.fly-left:not(.pin-left) #pane-left, .wb.fly-right:not(.pin-right) #pane-right { transform: none; visibility: visible; }
body.full .top, body.full .crumbs, body.full .legend, body.full .foot { display: none; }
.scrim { position: fixed; inset: 0; z-index: 39; background: rgba(5, 10, 20, 0.45); }
.scrim[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
    .wb:not(.pin-left) #pane-left, .wb:not(.pin-right) #pane-right { transition: none; }
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; z-index: 2; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); }
.seg button { height: 30px; padding: 0 12px; border-radius: 6px; border: 0; font-size: 12px; font-weight: 600; background: transparent; color: var(--soft); }
/* Same active look as the view tabs above, so one state reads one way. */
.seg button[aria-checked='true'], .seg button[aria-pressed='true'] { background: var(--brandTint); box-shadow: inset 0 0 0 1px var(--brandLine); color: var(--text); }
.seg .z { width: 32px; padding: 0; font-size: 16px; font-weight: 400; color: var(--text); }
.seg .fit { font-weight: 400; color: var(--text); }
.dd { position: relative; }
.seg .lim { display: inline-flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; color: var(--text); }
.seg .lim:hover, .seg .lim[aria-expanded='true'] { background: var(--raise); }
.chev { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--muted); transition: transform 0.15s; }
.lim[aria-expanded='true'] .chev { transform: rotate(180deg); }
.ddlist { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 100%; margin: 0; padding: 4px; list-style: none; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35); }
.ddlist [role='option'] { display: flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--soft); cursor: pointer; outline: none; }
.ddlist [role='option']:hover, .ddlist [role='option']:focus-visible, .ddlist [role='option']:focus { background: var(--raise); color: var(--text); }
.ddlist [role='option'][aria-selected='true'] { font-weight: 600; background: var(--brandTint); box-shadow: inset 0 0 0 1px var(--brandLine); color: var(--text); }
.backbtn { height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--brandLine); background: var(--brandTint); color: var(--text); font-size: 12px; font-weight: 600; }
.hintbar { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; color: var(--muted); font-family: var(--monof); z-index: 2; pointer-events: none; }
.hintbar span { padding: 4px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
.fullcard { position: absolute; right: 12px; top: 12px; width: 280px; max-width: calc(100% - 24px); padding: 14px; border-radius: 12px; border: 1px solid var(--brandLine); background: var(--panel); display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25); z-index: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 12px; }
.legend b { font-weight: 600; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.dot.ring { background: transparent; border: 2px solid var(--green); }
.dot.small { width: 7px; height: 7px; margin: 0 1px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; font-family: var(--monof); }
.foot span { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; }
.foot .hot { border-color: var(--amber); color: var(--amberText); }
.foot .note { border-style: dashed; border-color: var(--line2); color: var(--muted); }
.note-line { font-size: 12px; color: var(--muted); }

/* Layers lens */
.band { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); }
.band .head { flex: 0 0 150px; display: flex; flex-direction: column; gap: 4px; }
.band .head b { font-weight: 600; font-size: 14px; }
.band .dots { flex: 1 1 300px; min-width: 0; display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; align-items: center; }
.band .dots .dot { width: 9px; height: 9px; }
.band .dots .dot.ring { width: 9px; height: 9px; }
.band .dots .dot.small { width: 7px; height: 7px; }

/* Matrix lens */
.matrix { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px; }
.mgrid { min-width: 680px; display: flex; flex-direction: column; gap: 2px; }
.mrow { display: grid; gap: 2px; }
.mhead { font-size: 10px; color: var(--muted); text-align: center; font-family: var(--monof); }
.mlabel { font-family: var(--monof); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; line-height: 30px; color: var(--soft); }
.mlabel.sel, .mhead .sel { color: var(--brandText); font-weight: 600; }
.mcell { height: 30px; padding: 0; border-radius: 3px; font-family: var(--monof); font-size: 10px; border: 0; background: var(--rail); color: var(--text); }
.mcell.on { outline: 2px solid var(--text); outline-offset: -2px; }
.mcell.cycle { box-shadow: inset 0 0 0 2px var(--alert); }
.box { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 13px; }

/* Knowledge lens */
.kkeys { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; color: var(--soft); }
.kkeys .sq { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.kcols { overflow-x: auto; padding-bottom: 4px; }
.kgrid { display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 10px; min-width: 1240px; }
.kcol { display: flex; flex-direction: column; gap: 8px; }
.kcol .cap { display: flex; justify-content: space-between; }
.kcard { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; font-family: var(--monof); text-align: left; color: var(--text); overflow-wrap: anywhere; }
.kcard.selcard { padding: 10px; border-radius: 10px; border: 0; background: var(--brand); color: var(--onColor); font-weight: 600; }
.kcard.selcard small { display: block; font-weight: 400; font-size: 11px; }
.kcard small { display: block; color: var(--muted); font-size: 11px; }
.kcard.draft { border-style: dashed; border-color: var(--amber); }
.kcard.dup { border-color: var(--alert); }
.kcard.archived { color: var(--muted); }
.kmissing { padding: 12px; border-radius: 8px; border: 1px dashed var(--line2); display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 12px; }
.kmissing b { font-weight: 600; color: var(--soft); }
.kcards { display: flex; flex-wrap: wrap; gap: 10px; }
.kcards > div { flex: 1 1 220px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: flex; flex-direction: column; gap: 4px; }
.kcards .v { font-family: var(--monof); font-size: 18px; font-weight: 600; }
.kcards .alert { border-color: var(--alert); }
.kcards .alert .cap { color: var(--alertText); }

/* Treemap lens */
.treemap { position: relative; height: 600px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.tm { position: absolute; border: 1px solid var(--bg); overflow: hidden; padding: 4px 6px; font-family: var(--monof); font-size: 11px; text-align: left; color: var(--onColor); border-radius: 2px; }
.tm span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm small { display: block; opacity: 0.75; }

/* Right rail */
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; height: 46px; border: 0; border-bottom: 2px solid transparent; background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); }
.tab[aria-selected='true'] { border-bottom-color: var(--brand); color: var(--text); }
#panel { display: flex; flex-direction: column; }
.fhead { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.fhead .fn { font-family: var(--monof); font-size: 16px; font-weight: 600; color: var(--brandText); overflow-wrap: anywhere; }
.fhead .fp { font-family: var(--monof); font-size: 12px; color: var(--muted); word-break: break-all; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; font-family: var(--monof); }
.chips span { padding: 2px 8px; border-radius: 10px; background: var(--raise); color: var(--soft); }
.chips .c-cyan { background: var(--cyanTint); color: var(--cyanText); }
.chips .c-green { background: var(--greenTint); color: var(--greenText); }
.chips .c-guess { background: transparent; border: 1px dashed var(--amber); color: var(--amberText); }
.chips .c-miss { background: transparent; border: 1px dashed var(--line2); color: var(--muted); }
.chips .c-dead { background: transparent; border: 1px solid var(--alert); color: var(--alertText); }
.blast { margin: 14px; padding: 14px; border: 1px solid var(--brandLine); border-radius: 12px; background: var(--blastBg); display: flex; flex-direction: column; gap: 12px; }
.blast-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.blast-h b { font-weight: 600; font-size: 15px; }
.level { font-family: var(--monof); font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--greenTint); color: var(--greenText); text-transform: uppercase; }
.level.medium { background: var(--brandTint); color: var(--amberText); }
.level.high, .level.critical { background: var(--brandTint); color: var(--brandText); }
.scopes { display: flex; gap: 4px; padding: 3px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.scopes button { flex: 1; height: 32px; border-radius: 6px; border: 0; font-size: 12px; font-weight: 600; background: transparent; color: var(--soft); }
.scopes button[aria-checked='true'] { background: var(--amber); color: var(--onColor); }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.nums .v { font-family: var(--monof); font-size: 20px; font-weight: 600; }
.nums .v.hot { color: var(--amberText); }
.nums .l { font-size: 11px; color: var(--muted); }
.sharebar { position: relative; height: 8px; border-radius: 4px; background: var(--line); }
.sharebar i { display: block; min-width: 4px; height: 8px; border-radius: 4px; background: var(--amber); }
.sharebar .mark { position: absolute; top: -3px; width: 1px; height: 14px; background: var(--faint); }
.insight { font-size: 12px; color: var(--soft); padding: 8px 10px; border-radius: 8px; background: var(--bg); }
.dlist { display: flex; flex-direction: column; gap: 6px; }
.drow { display: flex; align-items: center; gap: 8px; font-size: 12px; font-family: var(--monof); border: 0; background: none; padding: 0; text-align: left; color: var(--text); width: 100%; }
.drow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .mt { color: var(--muted); font-size: 11px; flex: none; }
.side .sec h3, .sec-h { display: flex; justify-content: space-between; align-items: center; margin: 0; font-size: 14px; font-weight: 600; gap: 8px; }
.sec-h small { font-size: 11px; color: var(--muted); font-weight: 400; }
.rows { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-family: var(--monof); }
.rows button { display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 0; color: var(--text); text-align: left; font-family: var(--monof); font-size: 12px; width: 100%; }
.rows button span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .mt { color: var(--muted); flex: none; }
.symgrid { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-family: var(--monof); }
.symgrid div { display: grid; grid-template-columns: minmax(0, 1fr) 48px 70px 54px; gap: 6px; padding: 4px 6px; border-radius: 6px; background: var(--panel); }
.symgrid div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.symgrid .mt { color: var(--muted); }
.symgrid .hot { color: var(--alertText); }
.owner { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; font-size: 12px; }
.owner .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); }
.owner .bar i { display: block; height: 4px; border-radius: 2px; background: var(--cyan); }
.card { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.card.missing { border-style: dashed; border-color: var(--line2); background: transparent; color: var(--muted); }
.card .between { font-size: 14px; color: var(--text); }
.card .between b { font-weight: 600; }
.card .between .v { font-family: var(--monof); color: var(--amberText); }
.card p { margin: 0; font-size: 12px; color: var(--soft); overflow-wrap: anywhere; }
.card button { border: 0; background: none; padding: 0; text-align: left; font-family: var(--monof); font-size: 11px; color: var(--soft); overflow-wrap: anywhere; }
.pad { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.plist button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-radius: 6px; background: transparent; padding: 4px 6px; text-align: left; font-size: 12px; color: var(--text); }
.plist button:hover { background: var(--raise); }
.plist .fname { min-width: 0; overflow-wrap: anywhere; font-family: var(--monof); }
.plist .fdir { color: var(--muted); font-size: 11px; font-family: var(--monof); overflow-wrap: anywhere; }
.alabel { display: flex; flex-direction: column; min-width: 0; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.atiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.atiles .tile .v { font-size: 18px; }
.atiles .tile .l { font-size: 11px; color: var(--muted); }

@media (max-width: 720px) {
    .top { padding: 10px 12px; }
    .view { padding: 0 8px 8px; }
    .treemap { height: 460px; }
    .bar-top { padding: 10px 8px; }
    .filters { margin-left: 0; }
}

#graphwrap { display: flex; flex-direction: column; gap: 10px; }
#lensview { display: flex; flex-direction: column; gap: 14px; }
/* A control without data: visible, dashed, labelled — never hidden. */
.nodata { border-style: dashed !important; opacity: 0.75; }
.nodata-tag { margin-left: 6px; padding: 0 5px; border-radius: 4px; border: 1px dashed currentColor; font-size: 10px; font-weight: 600; letter-spacing: 0.02em; opacity: 0.85; white-space: nowrap; }
.opt.nodata { white-space: normal; height: auto; min-height: 34px; padding-top: 4px; padding-bottom: 4px; line-height: 1.25; }
.opt.nodata .nodata-tag { display: inline-block; margin-left: 4px; margin-top: 2px; }
</style>

    // Treemap: one level of the folder tree, area = lines, squarified.
    function renderTreemap() {
        var node = tree;
        if (state.treePath) state.treePath.split('/').forEach(function (seg) { node = node && node.kids[seg]; });
        if (!node) { state.treePath = ''; node = tree; }
        var locOf = function (n) {
            if (n.loc !== undefined) return n.loc;
            var s = 0;
            n.files.forEach(function (i) { s += files[i].loc || 0; });
            Object.keys(n.kids).forEach(function (k) { s += locOf(n.kids[k]); });
            n.loc = s;
            return s;
        };
        var items = [];
        Object.keys(node.kids).forEach(function (k) { var v = locOf(node.kids[k]); if (v > 0) items.push({ name: k, value: v, dir: true }); });
        node.files.forEach(function (i) { if (files[i].loc) items.push({ name: base(files[i].path), value: files[i].loc, file: i }); });
        items.sort(function (a, b) { return b.value - a.value; });
        items = items.slice(0, 120);
        var box = el('div', { class: 'treemap' });
        lensView.appendChild(box);
        var W = box.clientWidth || 800;
        var H = box.clientHeight || 600;
        var total = items.reduce(function (s, i) { return s + i.value; }, 0) || 1;
        items.forEach(function (i) { i.area = i.value / total * W * H; });
        var rects = [];
        (function squarify(list, x, y, w, h) {
            if (!list.length) return;
            if (list.length === 1) { rects.push([list[0], x, y, w, h]); return; }
            var side = Math.min(w, h);
            var row = [];
            var best = Infinity;
            var k = 0;
            for (; k < list.length; k++) {
                var trial = row.concat([list[k]]);
                var s = trial.reduce(function (a, b) { return a + b.area; }, 0);
                var worst = trial.reduce(function (m, r) { return Math.max(m, Math.max(side * side * r.area / (s * s), s * s / (side * side * r.area))); }, 0);
                if (worst > best) break;
                best = worst;
                row = trial;
            }
            var sum = row.reduce(function (a, b) { return a + b.area; }, 0);
            var thick = sum / side;
            var off = 0;
            row.forEach(function (r) {
                var len = r.area / thick;
                if (w >= h) rects.push([r, x, y + off, thick, len]); else rects.push([r, x + off, y, len, thick]);
                off += len;
            });
            if (w >= h) squarify(list.slice(row.length), x + thick, y, w - thick, h);
            else squarify(list.slice(row.length), x, y + thick, w, h - thick);
        })(items, 0, 0, W, H);
        rects.forEach(function (r) {
            var it = r[0];
            var b = el('button', { type: 'button', class: 'tm', title: (state.treePath ? state.treePath + '/' : '') + it.name + ' · ' + num(it.value) });
            b.style.left = r[1] + 'px'; b.style.top = r[2] + 'px'; b.style.width = Math.max(0, r[3]) + 'px'; b.style.height = Math.max(0, r[4]) + 'px';
            var colour;
            if (it.file !== undefined) colour = fileColour(it.file);
            else {
                var sample = -1;
                (function find(n) { if (sample >= 0) return; if (n.files.length) { sample = n.files[0]; return; } Object.keys(n.kids).some(function (k) { find(n.kids[k]); return sample >= 0; }); })(node.kids[it.name]);
                colour = state.colorBy === 'blast' || sample < 0 ? cat(strHash(it.name)) : fileColour(sample);
            }
            b.style.background = colour === 'var(--node)' ? 'var(--raise)' : colour;
            if (colour === 'var(--node)') b.style.color = 'var(--soft)';
            if (r[3] > 50 && r[4] > 22) add(b, el('span', null, it.name + (it.dir ? '/' : '')), r[4] > 36 ? el('small', null, num(it.value)) : null);
            b.addEventListener('click', function () {

                else { step(); state.treePath = state.treePath ? state.treePath + '/' + it.name : it.name; refresh(); }
            });
            box.appendChild(b);
        });
    }

        return b;
    }
    function renderFindings() {
        var p = el('div', { class: 'pad' });
        var cyc = (model.violations || []).filter(function (v) { return v.kind === 'cycle'; });
        var cycLines = [];
        if (an.cycles && an.cycles[0]) {
            var sizeOf = function (k) { return (an.cycleSizes && an.cycleSizes[k]) || an.cycles[k].length; };
            cycLines.push(el('p', null, t('biggest')(sizeOf(0)) + ' · ' + an.cycles[0].slice(0, 4).map(function (x) { return base(files[x].path); }).join(' ↔ ') + (sizeOf(0) > 4 ? ' ↔ …' : '')));
            an.cycles.slice(1, 3).forEach(function (c, k) { cycLines.push(el('p', null, sizeOf(k + 1) + ' · ' + dir(files[c[0]].path))); });
        }
        p.appendChild(findCard(t('cycles'), num(an.cyclesTotal), 'var(--amberText)', cycLines));
        p.appendChild(findCard(t('surprises'), num((an.surprises || []).length), 'var(--amberText)',
            (an.surprises || []).slice(0, 4).map(function (s) { return fileLink(s[0], files[s[0]].path + ' → ' + base(files[s[1]].path)); })));
        if (model.drift) {
            var d = model.drift;
            var lines = [];
            d.changed.slice(0, 3).forEach(function (c) { lines.push(el('p', null, areas[c[0]].id + ' +' + c[1] + ' / −' + c[2])); });
            d.appeared.slice(0, 2).forEach(function (a) { lines.push(el('p', null, '+ ' + areas[a].id + ' ' + areaLabel(areas[a]))); });
            d.vanished.slice(0, 2).forEach(function (v) { lines.push(el('p', null, '− ' + v)); });
            p.appendChild(findCard(t('drift'), num(d.changed.length + d.appeared.length + d.vanished.length + d.split.length + d.merged.length), 'var(--cyanText)', lines));
        }
        if (an.layerBreaches !== undefined) {
            p.appendChild(findCard(t('layerBreaches'), num(an.layerBreaches), 'var(--alertText)',
                (model.violations || []).filter(function (v) { return v.kind === 'layer'; }).slice(0, 4).map(function (v) {
                    return fileLink(v.files[0], base(files[v.files[0]].path) + ' → ' + base(files[v.files[1]].path) + ' (' + v.layers[0] + ' → ' + v.layers[1] + ')');
                })));
        } else p.appendChild(findCard(t('layerBreaches'), null, null, [el('p', null, t('needLayers'))], true));
        if (model.hotspots) {
            p.appendChild(findCard(t('hotspots'), num(model.hotspots.length), 'var(--brandText)', model.hotspots.slice(0, 5).map(function (h) {
                return fileLink(h[0], base(files[h[0]].path) + ' · ' + h[1] + ' × ' + num(h[2]));
            })));
        } else p.appendChild(findCard(t('hotspots'), null, null, [el('p', null, t('needChurn'))], true));
        if (an.deadFiles !== undefined) {
            var deadList = [];
            files.forEach(function (f, i) { if (f.dead && deadList.length < 5) deadList.push(fileLink(i)); });
            p.appendChild(findCard(t('deadFiles'), num(an.deadFiles), 'var(--alertText)', [el('p', null, an.deadBasis || '')].concat(deadList)));
        } else p.appendChild(findCard(t('deadFiles'), null, null, [el('p', null, an.deadBasis || t('missDead'))], true));
        if (model.prOverlap && model.prOverlap.conflicts.length) {
            p.appendChild(findCard(t('prs'), num(model.prOverlap.conflicts.length), 'var(--cyanText)', model.prOverlap.conflicts.slice(0, 4).map(function (c) {
                return el('p', null, '#' + c[0] + ' · #' + c[1] + ' → ' + c[2].map(function (a) { return areas[a].id; }).join(', '));
            })));
        }
        if (model.diff) {
            p.appendChild(findCard(t('change') + ' (' + model.diff.rev + ')', num(model.diff.changed.length) + ' / ' + num(model.diff.impacted.length), 'var(--cyanText)',
                model.diff.changed.slice(0, 5).map(function (i) { return fileLink(i); })));
        }
        panel.appendChild(p);
    }

    function renderAreaTab() {
        var ai = state.file >= 0 && files[state.file].area >= 0 ? files[state.file].area : state.area;
        var p = el('div', { class: 'pad' });
        if (ai >= 0) {
            var a = areas[ai];
            p.appendChild(el('div', { class: 'mono' }, a.id + ' · ' + a.name)).style.fontWeight = '600';
            var tiles = el('div', { class: 'atiles' });
            [[num(a.files.length), t('files')('').trim()], [pct(a.cohesion), t('cohesion')], [pct(a.testShare), t('testShare')]].forEach(function (x) {
                tiles.appendChild(add(el('div', { class: 'tile' }), el('div', { class: 'v' }, x[0]), el('div', { class: 'l' }, x[1])));
            });
            p.appendChild(tiles);
            p.appendChild(el('span', { class: 'soft' }, t('mismatch')(pct(a.folderMismatch))));
            var top = a.files.slice().sort(function (x, y) { return files[y].inFiles - files[x].inFiles || x - y; });
            p.appendChild(el('span', { class: 'muted' }, t('mostUsed') + ': ' + top.slice(0, 3).map(function (x) { return base(files[x].path); }).join(', ')));
            var ul = el('ul', { class: 'plist' });
            top.slice(0, 60).forEach(function (x) { ul.appendChild(fileRow(x, 'in ' + files[x].inFiles)); });
            p.appendChild(ul);
        }
        p.appendChild(el('span', { class: 'cap' }, t('allAreasList') + ' (' + areas.length + ')'));
        var list = el('ul', { class: 'plist' });
        areas.forEach(function (a, i) {
            var b = el('button', { type: 'button', class: 'aentry', title: a.name + ' · ' + a.files.length });
            var label = add(el('span', { class: 'alabel' }), el('span', { class: 'fname' }, a.id + ' · ' + areaLabel(a) + ' · ' + a.files.length));
            add(b, swatch(cat(i)), label);
            b.addEventListener('click', function () { openArea(i); });
            list.appendChild(add(el('li'), b));
        });
        p.appendChild(list);
        panel.appendChild(p);
    }

    // Navigation.
    function refresh() {
        renderLensBar();
        renderCrumbs();
        renderRail();
        renderLens();
        renderTabs();
        renderPanel();
        applyPanes(false);
        renderFull();
        if (state.lens === 'graph') draw(); else { renderFoot(); exposeView(); }
    }
    function renderFull() {
        var fb = $('full');
        fb.setAttribute('aria-pressed', String(state.full));
        $('full-label').textContent = state.full ? t('fullOff') : t('full');
        var card = $('fullcard');
        card.hidden = !(state.full && state.file >= 0);
        clear(card);
        if (card.hidden) return;
        var f = files[state.file];
        var w = walk(state.file, state.scope);
        var trans = w.byDepth[2].length + w.byDepth[3].length;
        add(card, el('span', { class: 'mono' }, base(f.path)), el('span', { class: 'mono muted' }, dir(f.path) + (f.area >= 0 ? ' · ' + areas[f.area].id : '') + ' · in ' + f.inFiles + ' · out ' + f.outFiles));
        card.firstChild.style.color = 'var(--brandText)';
        card.firstChild.style.fontWeight = '600';
        var n = el('div', { class: 'nums' });
        add(n, add(el('div'), el('div', { class: 'v hot' }, num(w.byDepth[1].length)), el('div', { class: 'l' }, t('direct'))),
            add(el('div'), el('div', { class: 'v' }, num(trans)), el('div', { class: 'l' }, t('transitive'))),
            add(el('div'), el('div', { class: 'v' }, num(w.byDepth[1].length + 0.5 * trans)), el('div', { class: 'l' }, t('score'))));
        card.appendChild(n);
        var back = el('button', { type: 'button', class: 'btn' }, t('showPanels'));
        back.addEventListener('click', function () { state.full = false; refresh(); resize(); });
        card.appendChild(back);
    }
    function resetView() { state.view = { scale: 1, x: 0, y: 0 }; state.rot = { yaw: ORB_YAW, pitch: ORB_PITCH }; }
    function goHome() { step(); state.level = 'overview'; state.lens = 'graph'; resetView(); refresh(); }
    function openArea(i) { step(); closeFlyouts(); if (state.file >= 0 && files[state.file].area !== i) state.file = -1; state.level = 'area'; state.area = i; state.lens = state.lens === 'graph' ? 'graph' : state.lens; resetView(); refresh(); }
    function openFile(i) {
        step();
        closeFlyouts();
        var f = files[i];
        if (state.lens === 'graph' && f.area >= 0 && (state.level !== 'area' || state.area !== f.area)) {
            state.level = 'area';
            state.area = f.area;
            resetView();
        }
        state.file = i;
        state.tab = 'file';
        refresh();
    }

    // Input.
    var drag = null;
    var frame = 0;
    canvas.addEventListener('pointerdown', function (e) {
        drag = { x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y, yaw: state.rot.yaw, pitch: state.rot.pitch, turn: state.orb && !e.shiftKey, moved: false };
        canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
        if (!drag) return;
        var dx = e.clientX - drag.x;
        var dy = e.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        if (!drag.moved) return;
        if (drag.turn) { state.rot.yaw = drag.yaw + dx * 0.008; state.rot.pitch = Math.max(-1.4, Math.min(1.4, drag.pitch - dy * 0.008)); }
        else { state.view.x = drag.vx + dx; state.view.y = drag.vy + dy; }
        if (!frame) frame = requestAnimationFrame(function () { frame = 0; draw(); });
    });
    function turnTo(yaw, pitch) { state.rot.yaw = yaw; state.rot.pitch = Math.max(-1.4, Math.min(1.4, pitch)); draw(); }
    canvas.addEventListener('pointerup', function (e) {
        var wasDrag = drag && drag.moved;
        drag = null;
        if (wasDrag) return;
        var r = canvas.getBoundingClientRect();
        select(hitTest(e.clientX - r.left, e.clientY - r.top));
    });
    // One click marks the node and what it reaches; a double click goes one level deeper.
    canvas.addEventListener('dblclick', function (e) {
        var r = canvas.getBoundingClientRect();
        var hit = hitTest(e.clientX - r.left, e.clientY - r.top);
        if (!hit) return;
        if (hit.kind === 'area') openArea(hit.idx);
        else openFile(hit.idx);
    });
    function select(hit) {
        if (!hit) {
            if (state.level === 'overview') state.area = -1;
            state.file = -1;
        } else if (hit.kind === 'area') {
            state.area = hit.idx;
            state.file = -1;
            state.tab = 'area';
        } else {
            state.file = hit.idx;
            state.tab = 'file';
        }
        refresh();
    }
    canvas.addEventListener('wheel', function (e) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12); }, { passive: false });
    function zoom(f) { state.view.scale = Math.min(8, Math.max(0.4, state.view.scale * f)); $('zoomtxt').textContent = 'Zoom ' + state.view.scale.toFixed(1) + '×'; draw(); }
    var TURN_KEYS = { ArrowLeft: [-0.15, 0], ArrowRight: [0.15, 0], ArrowUp: [0, 0.15], ArrowDown: [0, -0.15] };
    document.addEventListener('keydown', function (e) {
        var step = TURN_KEYS[e.key];
        if (step && state.orb && document.activeElement !== searchInput) { e.preventDefault(); turnTo(state.rot.yaw + step[0], state.rot.pitch + step[1]); return; }
        if (e.key === '/' && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); return; }
        if (e.key === 'Escape') {
            if (state.fly.left || state.fly.right) { state.fly.left = false; state.fly.right = false; applyPanes(false); return; }
            if (document.activeElement === searchInput && searchInput.value) { searchInput.value = ''; clear(results); return; }
            if (state.level === 'area') goHome(); else if (state.file >= 0 || state.area >= 0) { state.file = -1; state.area = -1; refresh(); }
        }
    });
    searchInput.addEventListener('input', function () {
        clear(results);
        var q = searchInput.value.trim().toLowerCase();
        if (q.length < 2) return;
        var hits = 0;
        function hit(text, fn) {
            var b = el('button', { type: 'button' }, text);
            b.addEventListener('click', function () { clear(results); searchInput.value = ''; fn(); });
            results.appendChild(add(el('li'), b));
            hits += 1;
        }
        areas.forEach(function (a, i) { if (hits < 30 && (a.name.toLowerCase().indexOf(q) >= 0 || a.id === q)) hit('◎ ' + a.id + ' · ' + a.name, function () { openArea(i); }); });
        (an.requestPaths || []).forEach(function (r) { if (hits < 30 && r.route.toLowerCase().indexOf(q) >= 0) hit('↳ ' + r.route, function () { openFile(r.handler >= 0 ? r.handler : r.file); }); });
        files.forEach(function (f, i) {
            if (hits >= 30) return;
            if (f.path.toLowerCase().indexOf(q) >= 0) { hit(f.path, function () { openFile(i); }); return; }
            var sym = f.symbols.filter(function (s) { return s[0].toLowerCase().indexOf(q) >= 0; })[0];
            if (sym) hit(sym[0] + ' — ' + f.path, function () { openFile(i); });
        });
    });

    function toggle(id, key) {
        var b = $(id);
        b.setAttribute('aria-pressed', String(state[key]));
        b.addEventListener('click', function () { state[key] = !state[key]; b.setAttribute('aria-pressed', String(state[key])); draw(); });
    }
    toggle('t-sure', 'showTrusted');
    toggle('t-guess', 'showGuesses');
    toggle('t-tests', 'showTests');
    toggle('t-infra', 'showInfra');
    $('full').addEventListener('click', function () { state.full = !state.full; refresh(); resize(); });
    ['left', 'right'].forEach(function (side) {
        var other = side === 'left' ? 'right' : 'left';
        $('open-' + side).addEventListener('click', function () {
            state.fly[side] = true;
            if (paneMode() === 'phone') state.fly[other] = false;
            applyPanes(false);
        });
        $('close-' + side).addEventListener('click', function () { state.fly[side] = false; applyPanes(false); });
        $('pin-' + side).addEventListener('click', function () {
            state.pin[side] = !isPinned(side);
            state.fly[side] = false;
            applyPanes(true);
        });
    });
    $('scrim').addEventListener('click', function () { state.fly.left = false; state.fly.right = false; applyPanes(false); });
    $('z-in').addEventListener('click', function () { zoom(1.4); });
    $('z-out').addEventListener('click', function () { zoom(1 / 1.4); });
    $('z-fit').addEventListener('click', function () { resetView(); zoom(1); });
    $('back').addEventListener('click', goHome);
    var dim2d = $('dim2d');
    var dimButton = $('dim');
    function setOrb(on) {
        state.orb = on;
        dimButton.setAttribute('aria-pressed', String(on));
        dim2d.setAttribute('aria-pressed', String(!on));
        resetView();
        refresh();
    }
    dimButton.addEventListener('click', function () { setOrb(!state.orb); });
    // The area limit is a listbox, not a <select>: a native select opens the system's own list.
    var limButton = $('lim');
    var limList = $('limlist');
    function limOptions() { return Array.prototype.slice.call(limList.querySelectorAll('[role="option"]')); }
    function limLabel(v) { return v === 'all' ? t('limAll') : t('limTop')(v); }
    function limOpen(open) {
        limList.hidden = !open;
        limButton.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) (limList.querySelector('[aria-selected="true"]') || limOptions()[0]).focus();
    }
    function limPick(v) {
        limButton.setAttribute('data-value', v);
        limOptions().forEach(function (o) { o.setAttribute('aria-selected', o.getAttribute('data-value') === v ? 'true' : 'false'); });
        $('limtxt').textContent = limLabel(v);
        limOpen(false);
        limButton.focus();
        state.areaLimit = v === 'all' ? 'all' : Number(v);
        resetView();
        refresh();
    }
    limButton.addEventListener('click', function () { limOpen(limList.hidden); });
    limButton.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); limOpen(true); }
    });
    limList.addEventListener('click', function (e) {
        var o = e.target.closest('[role="option"]');
        if (o) limPick(o.getAttribute('data-value'));
    });
    limList.addEventListener('keydown', function (e) {
        var opts = limOptions();
        var i = opts.indexOf(document.activeElement);
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            opts[Math.max(0, Math.min(opts.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus();
        } else if (e.key === 'Home' || e.key === 'End') {
            e.preventDefault();
            opts[e.key === 'Home' ? 0 : opts.length - 1].focus();
        } else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (i >= 0) limPick(opts[i].getAttribute('data-value'));
        } else if (e.key === 'Escape') {
            e.preventDefault();
            limOpen(false);
            limButton.focus();
        } else if (e.key === 'Tab') {
            limOpen(false);
        }
    });
    document.addEventListener('pointerdown', function (e) {
        if (!limList.hidden && !e.target.closest('.dd')) limOpen(false);
    });
    dim2d.addEventListener('click', function () { setOrb(false); });
    $('export').addEventListener('click', function () {
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var a = el('a', { download: 'map.json' });
        a.href = URL.createObjectURL(blob);
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    });

    var theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    function applyTheme() {
        document.documentElement.dataset.resolvedTheme = theme;
        colourCache = Object.create(null);
        var b = $('theme');
        var label = theme === 'light' ? t('dark') : t('light');
        b.setAttribute('aria-label', label);
        b.setAttribute('title', label);
        $('theme-sun').hidden = theme === 'light';
        $('theme-moon').hidden = theme !== 'light';
    }
    $('theme').addEventListener('click', function () { theme = theme === 'light' ? 'dark' : 'light'; applyTheme(); refresh(); });
    $('lang').addEventListener('click', function () { lang = lang === 'de' ? 'en' : 'de'; applyStrings(); refresh(); });
    function applyStrings() {
        document.documentElement.lang = lang;
        searchInput.setAttribute('placeholder', t('search'));
        searchInput.setAttribute('aria-label', t('search'));
        $('export').textContent = t('exportBtn');
        $('lang').textContent = t('langBtn');
        $('edges-label').textContent = t('edges');
        $('t-sure').textContent = t('sure');
        $('t-guess').textContent = t('guessed');
        $('t-tests').textContent = t('fTests');
        $('t-infra').textContent = t('fInfra');
        $('z-in').setAttribute('aria-label', t('zoomIn'));
        $('z-out').setAttribute('aria-label', t('zoomOut'));
        $('z-fit').textContent = t('fit');
        dim2d.textContent = t('d2');
        $('open-left').textContent = t('openLeft');
        $('open-right').textContent = t('openRight');
        ['left', 'right'].forEach(function (side) { $('close-' + side).setAttribute('aria-label', t('closePane')); });
        limOptions().forEach(function (o) { o.textContent = limLabel(o.getAttribute('data-value')); });
        $('limtxt').textContent = limLabel(limButton.getAttribute('data-value'));
        limButton.setAttribute('aria-label', t('limLabel'));
        limList.setAttribute('aria-label', t('limLabel'));
        dimButton.textContent = t('d3');
        dimButton.setAttribute('title', t('dimHint'));
        $('back').textContent = t('allAreas');
        applyTheme();
    }

    applyStrings();
    renderHeader();
    window.addEventListener('resize', function () { applyPanes(false); resize(); if (state.lens === 'treemap') renderLens(); });
    // The stage also changes size without a window resize (controls appearing, panes, full screen).
    if (window.ResizeObserver) new ResizeObserver(function () {
        var dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
        if (r.width && (canvas.width !== Math.max(1, Math.round(r.width * dpr)) || canvas.height !== Math.max(1, Math.round(r.height * dpr)))) resize();
    }).observe(canvas);
    refresh();
    resize();
})();
</script>
</body>
</html>
