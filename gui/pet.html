<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pet</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* Grab strip on top: dragging the window without eating sprite clicks. */
      #drag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 24px;
        cursor: grab;
        z-index: 3;
      }
      #stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        height: 100vh;
        padding-bottom: 6px;
        box-sizing: border-box;
      }
      #bubble {
        display: none;
        max-width: 200px;
        color: #fff;
        background: rgba(20, 22, 28, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 5px 9px;
        border-radius: 10px;
        line-height: 1.35;
      }
      #bubble.show {
        display: block;
      }
      #bubble.actionable {
        cursor: pointer;
        border-color: rgba(120, 180, 255, 0.7);
      }
      #bubble.actionable::after {
        content: " → click to switch";
        opacity: 0.7;
      }
      #spritebox {
        position: relative;
      }
      #sprite {
        width: 192px;
        height: 208px;
        background-repeat: no-repeat;
        background-position-x: 0px;
        background-position-y: var(--row-y, 0px);
        image-rendering: pixelated;
        cursor: pointer;
      }
      @keyframes pet-frames {
        from {
          background-position-x: 0px;
        }
        to {
          background-position-x: var(--end-x, -1152px);
        }
      }
      /* Ambient context mood (worst live-session context fill). */
      #mood {
        display: none;
        position: absolute;
        top: 2px;
        right: 2px;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 1.5px solid rgba(0, 0, 0, 0.5);
      }
      #mood.watch {
        display: block;
        background: #f0b429;
      }
      #mood.alarm {
        display: block;
        background: #ef4444;
        animation: mood-pulse 1.2s ease-in-out infinite;
      }
      @keyframes mood-pulse {
        50% {
          transform: scale(1.35);
        }
      }
      #label {
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="drag" data-tauri-drag-region></div>
    <div id="stage">
      <div id="bubble"></div>
      <div id="spritebox">
        <div id="sprite"></div>
        <div id="mood"></div>
      </div>
      <div id="label"></div>
    </div>
    <script type="module" src="/src/pet-main.ts"></script>
  </body>
</html>
