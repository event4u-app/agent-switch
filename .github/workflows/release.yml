name: Release

# Build the Tauri GUI installers for macOS, Linux, and Windows and attach them
# to a GitHub Release. The `agent-switch` CLI itself ships via npm (see the
# `pack` job in ci.yml) — the GUI locates it on PATH at runtime, so these
# installers cover the desktop shell only.
on:
  push:
    tags:
      # Bare-numeric version tags (no `v` prefix) — matches the published 1.0.0
      # release and the @event4u/agent-config convention.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

jobs:
  installers:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # tauri-action creates the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg/.app that runs on both Apple Silicon and Intel.
          - os: macos-latest
            label: macOS (universal)
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          # 22.04 keeps the glibc/webkit floor low for broad Linux compatibility.
          - os: ubuntu-22.04
            label: Linux (deb / rpm / AppImage)
            rust-targets: ""
            args: ""
          - os: windows-latest
            label: Windows (msi / nsis / portable exe)
            rust-targets: ""
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundling dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            build-essential \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      # tauri-action does not install frontend deps itself; the Tauri
      # beforeBuildCommand (`npm run build` → vite) needs them present.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: gui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          # Tag-triggered: reuse the pushed bare tag (e.g. 1.2.0). Manual runs
          # fall back to the app version so a dispatch still lands on a release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '__VERSION__' }}
          releaseName: "${{ github.ref_type == 'tag' && github.ref_name || '__VERSION__' }}"
          # Publish immediately (NOT a draft) — a draft release is invisible to
          # GitHub's /releases/latest, so the in-app update check never sees it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # `agent-switch gui` downloads these release artifacts on first use —
          # the .app.tar.gz (macOS) / .AppImage (Linux) are runnable directly;
          # Windows gets a portable exe in the next step.

      # `agent-switch gui` runs the app directly on Windows too — never an
      # installer. Tauri's raw exe embeds the frontend; WebView2 ships with
      # Windows 10/11. tauri-action has created the release by now.
      - name: Upload the portable Windows exe
        if: matrix.os == 'windows-latest' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          exe="gui/src-tauri/target/release/agent-switch-gui.exe"
          test -f "$exe" || { echo "missing $exe"; ls gui/src-tauri/target/release; exit 1; }
          cp "$exe" "agent-switch_${TAG}_x64-portable.exe"
          gh release upload "$TAG" "agent-switch_${TAG}_x64-portable.exe" --clobber

      # The as-hook relay (road-to-agent-switch-v3-central M2), one binary per
      # platform next to the installers. Users put it in place with
      # `agent-switch hooks relay <file>`; nothing downloads it on its own.
      - name: Build and upload the as-hook relay
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          case "${{ matrix.os }}" in
            macos-*)
              cargo build --release --manifest-path relay/Cargo.toml --target aarch64-apple-darwin
              cargo build --release --manifest-path relay/Cargo.toml --target x86_64-apple-darwin
              lipo -create -output "as-hook_${TAG}_macos-universal" \
                relay/target/aarch64-apple-darwin/release/as-hook relay/target/x86_64-apple-darwin/release/as-hook
              gh release upload "$TAG" "as-hook_${TAG}_macos-universal" --clobber ;;
            ubuntu-*)
              cargo build --release --manifest-path relay/Cargo.toml
              cp relay/target/release/as-hook "as-hook_${TAG}_linux-x64"
              gh release upload "$TAG" "as-hook_${TAG}_linux-x64" --clobber ;;
            windows-*)
              cargo build --release --manifest-path relay/Cargo.toml
              cp relay/target/release/as-hook.exe "as-hook_${TAG}_windows-x64.exe"
              gh release upload "$TAG" "as-hook_${TAG}_windows-x64.exe" --clobber ;;
          esac
