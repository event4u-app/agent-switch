name: CI

on:
  push:
    branches: [main, dev/v3]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Contract tests (AGENT_SWITCH_CONTRACT_TESTS) stay opt-in / local — they need
      # a real Claude Code login and live network, so CI runs the unit suite only.
      - run: npm test

  pack:
    name: tarball smoke (ubuntu · node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Install the packed tarball into a throwaway prefix and smoke the bin.
      - run: |
          set -e
          npm pack
          # Scoped package (@event4u/agent-switch) packs as event4u-agent-switch-*.tgz.
          tgz="$(ls event4u-agent-switch-*.tgz)"
          prefix="$(mktemp -d)"
          npm install -g --prefix "$prefix" "./$tgz"
          "$prefix/bin/agent-switch" --help
          AGENT_SWITCH_HOME="$(mktemp -d)" "$prefix/bin/agent-switch" doctor || true

  gui:
    name: gui ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: gui
      - run: npm test
        working-directory: gui
      - run: npx tsc --noEmit
        working-directory: gui
      - run: npm run build
        working-directory: gui
      # Compile-check the Tauri Rust shell. Now gating (was advisory, which
      # masked a missing icon asset + missing serde deps) — the shell compiles
      # with the generated icon set and standard Tauri deps.
      - run: cargo check --manifest-path gui/src-tauri/Cargo.toml

  coverage:
    # Floors live in package.json (root) and gui/vite.config.ts (GUI): the
    # 2026-11-01 measurement minus 1 point, rounded down. Raise them when
    # coverage rises; never lower them. Measured on macOS, so it runs there.
    name: coverage floor (macos · node 22)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: npm ci
        working-directory: gui
      - run: npm run coverage
        working-directory: gui

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The CLI ships with zero runtime dependencies; this keeps it honest.
      - run: npm audit --omit=dev
      # Gates what ships in the app bundle. The GUI's dev tooling (vite, vitest)
      # carries advisories only fixable by a major upgrade — tracked in the
      # roadmap, not gated here.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: gui
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
        working-directory: gui/src-tauri

  pets:
    name: pet sprite geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow is the only dep of scripts/pets/validate.py — not available on the
      # dev machine, which is why sprite geometry is checked in CI (roadmap
      # desktop-pet Phase 2). Validates all bundled pets against the OpenPets
      # contract: sheet size, per-row frame counts, no empty/duplicate frames,
      # no art in unused columns, no side-edge clipping.
      - run: pip install Pillow
      - run: python scripts/pets/validate.py gui/public/pets/

  docs:
    name: docs build + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated reads each page's git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: starlight/package-lock.json
      - name: Install docs dependencies
        working-directory: starlight
        run: npm ci
      # prebuild syncs the shared images; starlight-links-validator fails the
      # build on any broken internal link.
      - name: Build docs site
        working-directory: starlight
        run: npm run build
